<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Management - Aruna Textiles</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../static/css/style.css">
<script>
(function(){
    try {
        var s = localStorage.getItem('app-theme') || localStorage.getItem('pm_theme');
        var t = s || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.dataset.theme = t;
    } catch(e){}
})();
</script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <i class="fas fa-industry"></i>
            <span>ARUNA</span>
        </div>
    </div>

    <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </a>
        <a href="inventory.html" class="nav-item">
            <i class="fas fa-boxes"></i>
            <span>Inventory</span>
        </a>
        <a href="stock.html" class="nav-item active">
            <i class="fas fa-warehouse"></i>
            <span>Stock Management</span>
        </a>
        <a href="data_view.html" class="nav-item">
            <i class="fas fa-database"></i>
            <span>Data</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="#" class="nav-item logout" onclick="App.logout(); return false;">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-container">
    <header class="header">
        <div class="header-content">
            <h1 class="page-title">Stock Management</h1>
            <div class="header-info">
                <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme" aria-label="Toggle light or dark theme">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span>Admin</span>
                </div>
            </div>
        </div>
    </header>

    <div class="content">
        <div class="data-card">
            <div class="card-header">
                <h3><i class="fas fa-cubes"></i> Raw Material Inventory</h3>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Material Name</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Supplier</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <!-- Populated dynamically from database -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="../static/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    App.requireLogin();
    const tbody = document.getElementById('stockTableBody');
    try {
        const inv = await App.getInventory();
        const items = [...(inv.cotton || []), ...(inv.yarn || [])];
        if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">No inventory items found.</td></tr>';
            return;
        }
        tbody.innerHTML = '';
        items.forEach(item => {
            const isLow = (item.stock || 0) <= (item.minLevel || 0);
            const statusCls = isLow ? 'incomplete' : 'completed';
            const statusText = isLow ? 'Low Stock' : 'In Stock';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.id || '—'}</strong></td>
                <td>${item.type || 'Raw Material'}</td>
                <td>${(item.stock || 0).toLocaleString()}</td>
                <td>Kg</td>
                <td>${item.location || 'Warehouse A'}</td>
                <td><span class="status ${statusCls}">${statusText}</span></td>
            `;
            tbody.appendChild(tr);
        });
    } catch (e) {
        console.error('Failed to load stock from DB:', e);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Failed to connect to database.</td></tr>';
    }
});
</script>
</body>
</html>
